[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-decomposition-and-planning"
version = "0.1.0"
dependencies = [
    "langchain-core",
    "pydantic>=2.7,<3",
    "networkx>=3.4,<3.5",
]

[tool.setuptools.packages.find]
include = ["planning_lab*"]